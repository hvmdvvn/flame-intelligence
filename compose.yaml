services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      FLAME_DATA_DIR: /data
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      API_POSTS_PER_MINUTE: "30"
      LLM_PROVIDER: ""
      FLAME_ADMIN_TOKEN: ${FLAME_ADMIN_TOKEN:-}
    volumes:
      - research-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /service
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
volumes:
  research-data:
